# Default: development database. Full stack: docker compose --profile app up --build -d
services:
  postgres:
    image: postgres:18.7-alpine3.24
    entrypoint: ["/bin/sh", "/opt/jot/start-postgres.sh"]
    command: ["postgres"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-jot-admin-development}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-jot}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - postgres18:/var/lib/postgresql
      - ./scripts/database/init-postgres.sh:/docker-entrypoint-initdb.d/10-jot.sh:ro
      - ./scripts/database/start-postgres.sh:/opt/jot/start-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jot -d jot"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    command: ["jot-migrate"]
    healthcheck:
      disable: true
    environment: &backend-env
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://jot@postgres:5432/jot?sslmode=disable}
      DATABASE_URL_UNPOOLED: ${COMPOSE_DATABASE_URL_UNPOOLED:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:-jot}
      APP_ENV: ${APP_ENV:-development}
      TRUSTED_PROXY_CIDRS: ${JOT_WEB_IP:-172.31.97.254}/32
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      API_ADDR: :8080
      UPLOAD_DIR: /data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    environment: *backend-env
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    command: ["jot-worker"]
    # Worker has no HTTP listener; monitor process, queue age and failed jobs.
    healthcheck:
      disable: true
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    networks:
      default:
        ipv4_address: ${JOT_WEB_IP:-172.31.97.254}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  ingress:
    profiles: ["app"]
    image: caddy:2.11.9-alpine
    environment:
      SITE_ADDRESS: :80
    ports: ["127.0.0.1:${WEB_PORT:-3000}:80"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: ${JOT_SUBNET:-172.31.97.0/24}
volumes:
  postgres18:
  uploads:
  caddy_data:
  caddy_config:
