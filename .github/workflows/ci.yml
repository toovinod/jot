name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: jot
          POSTGRES_PASSWORD: jot
          POSTGRES_DB: jot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jot -d jot_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://jot:jot@127.0.0.1:5432/jot_test?sslmode=disable
      JOT_TEST_DATABASE_URL: postgres://jot:jot@127.0.0.1:5432/jot_test?sslmode=disable
      APP_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:8080
      API_ADDR: ":8080"
      UPLOAD_DIR: /tmp/jot-ci-uploads
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - run: go test -race ./...
        working-directory: apps/api
      - run: bun run build
      - name: Cross-service HTTP integration
        run: bash scripts/ci/http-smoke.sh
      - name: Service logs
        if: failure()
        run: cat /tmp/jot-ci-api.log /tmp/jot-ci-web.log 2>/dev/null || true
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun run check:containers
      - name: Verify nested secrets stay outside build context
        run: bash scripts/ci/docker-context.sh
      - run: docker run --rm -e SITE_ADDRESS=:80 -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker build -f docker/go.Dockerfile -t jot-api:test .
      - run: docker build -f docker/web.Dockerfile -t jot-web:test .
      - run: bun install --frozen-lockfile
      - name: Start full stack through Caddy
        run: docker compose --profile app up -d --build --wait
      - name: HTTP smoke through sanitized ingress
        env:
          APP_ORIGIN: http://localhost:3000
          JOT_SMOKE_URL: http://localhost:3000
        run: bun run test:integration
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose --profile app down
